---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# node-publish-action
name: "🚀 Node.js Package Publish"
# yamllint disable-line rule:line-length
description: "Stamps a version into package.json and publishes the package to an npm registry"
# Composes node-create-npmrc-action for registry authentication, then
# runs 'npm version' and 'npm publish' with verification. The npmrc
# action registers a guaranteed post-job step that scrubs the
# credential file, so this action adds no duplicate cleanup. Dry-run
# mode skips the credential machinery entirely and performs a local
# packing exercise with 'npm publish --dry-run'.

inputs:
  # Mandatory
  publish_version:
    # yamllint disable-line rule:line-length
    description: "Version to stamp and publish, such as '1.2.3' or '1.2.3-SNAPSHOT'; characters 0-9 A-Z a-z . -"
    required: true
  # Optional
  registry_url:
    # yamllint disable-line rule:line-length
    description: "Target npm registry URL ending with '/'; required unless dry_run is 'true'; characters A-Z a-z 0-9 . : / _ -"
    required: false
    default: ""
  dry_run:
    # yamllint disable-line rule:line-length
    description: "Pack and verify without registry interaction ('true'/'false'); skips credential setup"
    required: false
    default: "false"
  path_prefix:
    description: "Project directory; must resolve within the workspace"
    required: false
    default: "."
  node_version:
    # yamllint disable-line rule:line-length
    description: "Node.js version to set up, such as '22', '22.x' or 'lts/*'; characters A-Z a-z 0-9 . * / _ -"
    required: false
    default: "22"
  node_version_file:
    # yamllint disable-line rule:line-length
    description: "File containing the Node.js version, such as '.nvmrc'; takes precedence over node_version; must resolve within the workspace"
    required: false
    default: ""
  tag:
    # yamllint disable-line rule:line-length
    description: "npm distribution tag; characters A-Z a-z 0-9 . _ -"
    required: false
    default: "latest"
  access:
    description: "Package access: 'public', 'restricted' or unset"
    required: false
    default: ""
  provenance:
    # yamllint disable-line rule:line-length
    description: "Generate registry-native provenance ('true'/'false'); needs a registry with Sigstore provenance support (npmjs.org) plus OIDC; Nexus lacks support"
    required: false
    default: "false"
  # Credential pass-through for node-create-npmrc-action (unused in
  # dry-run mode). Three mutually exclusive authentication modes:
  # Basic auth (nexus_user/nexus_password or load_credential), bearer
  # token (auth_token), or OIDC trusted publishing (oidc).
  nexus_user:
    # yamllint disable-line rule:line-length
    description: "Basic auth username (default: calling repository name); ignored when auth_token or oidc selects a different mode"
    required: false
    default: ""
  nexus_password:
    # yamllint disable-line rule:line-length
    description: "Registry password/token; required for non-dry-run publishes unless load_credential is 'true'"
    required: false
    default: ""
  auth_token:
    # yamllint disable-line rule:line-length
    description: "Bearer token written as '_authToken'; use for registries that reject Basic auth (for example registry.npmjs.org). Excludes nexus_password, load_credential and oidc; nexus_user is ignored"
    required: false
    default: ""
  oidc:
    # yamllint disable-line rule:line-length
    description: "Publish via npm OIDC trusted publishing ('true'/'false'). Stores no credential: npm exchanges a GitHub OIDC token at publish time, and generates provenance itself where it supports doing so (public package from a public repository). Needs 'id-token: write', npm >= 11.5.2 and Node >= 22.14.0"
    required: false
    default: "false"
  load_credential:
    # yamllint disable-line rule:line-length
    description: "Fetch the password from 1Password via credential-load-action ('true'/'false')"
    required: false
    default: "false"
  vault_mapping_json:
    # yamllint disable-line rule:line-length
    description: "JSON mapping repository owner to 1Password vault (used when load_credential is 'true')"
    required: false
    default: ""
  op_service_account_token:
    # yamllint disable-line rule:line-length
    description: "1Password service account token (used when load_credential is 'true')"
    required: false
    default: ""
  scope:
    description: "npm scope for the auth entry (for example '@onap')"
    required: false
    default: ""

outputs:
  published_version:
    description: "Version stamped into package.json and published"
    value: ${{ steps.publish.outputs.published_version }}
  package_name:
    description: "Package name from the publish metadata"
    value: ${{ steps.publish.outputs.package_name }}
  tarball_name:
    description: "Tarball filename from the publish metadata"
    value: ${{ steps.publish.outputs.tarball_name }}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_PUBLISH_VERSION: ${{ inputs.publish_version }}
        INPUT_REGISTRY_URL: ${{ inputs.registry_url }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_NODE_VERSION_FILE: ${{ inputs.node_version_file }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ACCESS: ${{ inputs.access }}
        INPUT_PROVENANCE: ${{ inputs.provenance }}
        INPUT_LOAD_CREDENTIAL: ${{ inputs.load_credential }}
        INPUT_NEXUS_USER: ${{ inputs.nexus_user }}
        INPUT_NEXUS_PASSWORD: ${{ inputs.nexus_password }}
        INPUT_AUTH_TOKEN: ${{ inputs.auth_token }}
        INPUT_OIDC: ${{ inputs.oidc }}
        INPUT_VAULT_MAPPING_JSON: ${{ inputs.vault_mapping_json }}
        INPUT_OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op_service_account_token }}
      run: |
        # Validate inputs
        # Preflight: fail with a clear message when required tools are
        # missing (possible on minimal self-hosted runners)
        for tool in jq realpath mktemp tr; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            echo "This action requires jq, realpath (GNU coreutils,"
            echo "including -m), mktemp and tr on the runner"
            exit 1
          fi
        done
        # A workspace selector is at odds with this action's
        # contract: it publishes the single package at path_prefix,
        # verifies one version and reports one result. A selector can
        # match several packages, and npm would publish them all
        # before anything here could object -- irreversibly. Reject
        # it up front and point at the input that expresses the same
        # intent unambiguously.
        #
        # compgen suffices here, unlike the credential scan: these
        # names are valid shell identifiers. npm matches the prefix
        # case insensitively, so fold before comparing.
        while IFS= read -r env_name; do
          case "$(printf '%s' "${env_name}" \
            | tr '[:upper:]' '[:lower:]')" in
            npm_config_workspace)
              # npm's loadEnv skips empty values outright, so an
              # exported but empty selector selects nothing and must
              # not be treated as one.
              if [ -n "${!env_name}" ]; then
                echo "Error: a workspace is selected through" \
                  "${env_name} ❌"
                echo "This action publishes one package. Point"
                echo "path_prefix at the workspace package instead."
                exit 1
              fi ;;
          esac
        done < <(compgen -e)
        # The toolchain floor comparison needs more, but only under
        # OIDC. Requiring them unconditionally would newly fail a
        # Basic or token publish on a minimal runner, and this change
        # is meant to leave those paths untouched.
        if [ "${INPUT_OIDC}" = "true" ]; then
          for tool in sort head; do
            if ! command -v "${tool}" > /dev/null 2>&1; then
              echo "Error: required tool not found: ${tool} ❌"
              echo "OIDC trusted publishing additionally requires"
              echo "sort (GNU, with -V) and head"
              exit 1
            fi
          done
          # Finding a sort binary does not prove it version-sorts;
          # BSD sort accepts no -V, and the toolchain floor silently
          # depends on that ordering
          if ! printf '1.0.0\n' | sort -V > /dev/null 2>&1; then
            echo "Error: sort does not support the -V option ❌"
            echo "OIDC trusted publishing needs GNU sort to compare"
            echo "npm and Node versions against their floors"
            exit 1
          fi
        fi
        # The action requires GNU realpath -m (missing-path
        # resolution); BSD/macOS realpath lacks it, and failing here
        # gives a clearer error than a mid-run failure
        if ! realpath -m -- / > /dev/null 2>&1; then
          echo "Error: realpath does not support the -m option ❌"
          echo "This action requires GNU coreutils realpath"
          exit 1
        fi
        # The workspace boundary checks depend on these runner
        # environment variables: an empty value would degrade the
        # case patterns to /* and disable the escape checks
        for dir_var in GITHUB_WORKSPACE RUNNER_TEMP; do
          dir_value="${!dir_var:-}"
          if [ -z "${dir_value}" ] || [ ! -d "${dir_value}" ]; then
            echo "Error: ${dir_var} not set to a directory ❌"
            echo "This action requires a standard runner environment"
            exit 1
          fi
        done
        # A case glob validates the entire string, including embedded
        # newlines; grep would only validate per line
        case "${INPUT_DRY_RUN}" in
          true|false) ;;
          *)
            echo "Error: dry_run must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_PROVENANCE}" in
          true|false) ;;
          *)
            echo "Error: provenance must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_LOAD_CREDENTIAL}" in
          true|false) ;;
          *)
            echo "Error: load_credential must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_OIDC}" in
          true|false) ;;
          *)
            echo "Error: oidc must be 'true' or 'false' ❌"
            exit 1 ;;
        esac
        case "${INPUT_ACCESS}" in
          ''|public|restricted) ;;
          *)
            echo "Error: invalid access ❌"
            echo "Expected: 'public', 'restricted' or unset"
            exit 1 ;;
        esac
        # Restrict the distribution tag to a safe character set; the
        # value becomes an npm publish argument
        case "${INPUT_TAG}" in
          *[!A-Za-z0-9._-]*|'')
            echo "Error: invalid tag ❌"
            echo "Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1 ;;
        esac
        # The version needs a strict allowlist (no shell
        # metacharacters, no whitespace, no embedded newlines) plus a
        # structural check for three all-digit, dot-separated
        # segments; a '-' suffix such as '-SNAPSHOT' or '-rc.1' may
        # follow the third segment
        case "${INPUT_PUBLISH_VERSION}" in
          *[!0-9A-Za-z.-]*|'')
            echo "Error: invalid publish_version ❌"
            echo "Allowed characters: 0-9 A-Z a-z . -"
            exit 1 ;;
        esac
        version_error() {
          echo "Error: invalid publish_version ❌"
          echo "Expected a semver-style version such as 1.2.3,"
          echo "1.2.3-SNAPSHOT or 1.2.3-rc.1"
          exit 1
        }
        case "${INPUT_PUBLISH_VERSION}" in
          *.*.*) ;;
          *) version_error ;;
        esac
        major="${INPUT_PUBLISH_VERSION%%.*}"
        minor_rest="${INPUT_PUBLISH_VERSION#*.}"
        minor="${minor_rest%%.*}"
        rest="${minor_rest#*.}"
        patch="${rest%%-*}"
        # MAJOR, MINOR and PATCH must contain digits alone; the
        # allowlist above already constrains any suffix after the
        # first '-'
        for segment in "${major}" "${minor}" "${patch}"; do
          case "${segment}" in
            ''|*[!0-9]*) version_error ;;
          esac
        done
        # The registry URL is mandatory for real publishes; a dry run
        # publishes nothing, so it needs none. Validate any provided
        # value: https scheme, trailing slash, non-empty host and a
        # character allowlist that excludes whitespace, userinfo
        # separators and shell metacharacters
        if [ "${INPUT_DRY_RUN}" != "true" ] && \
          [ -z "${INPUT_REGISTRY_URL}" ]; then
          echo "Error: registry_url required unless dry_run ❌"
          exit 1
        fi
        if [ -n "${INPUT_REGISTRY_URL}" ]; then
          case "${INPUT_REGISTRY_URL}" in
            *[!A-Za-z0-9.:/_-]*)
              echo "Error: invalid registry_url characters ❌"
              echo "Allowed characters: A-Z a-z 0-9 . : / _ -"
              exit 1 ;;
          esac
          case "${INPUT_REGISTRY_URL}" in
            https://?*/) ;;
            *)
              echo "Error: invalid registry_url ❌"
              echo "Expected https://<host>/<path>/ with a"
              echo "trailing slash"
              exit 1 ;;
          esac
          case "${INPUT_REGISTRY_URL}" in
            https:///*)
              echo "Error: registry_url must include a host ❌"
              exit 1 ;;
          esac
        fi
        # Exactly one authentication mode. Basic auth folds a password
        # into an .npmrc entry, token auth writes a bearer token, and
        # OIDC stores nothing at all, so accepting more than one would
        # leave the effective credential ambiguous.
        modes=0
        if [ "${INPUT_OIDC}" = "true" ]; then
          modes=$((modes + 1))
        fi
        if [ -n "${INPUT_AUTH_TOKEN}" ]; then
          modes=$((modes + 1))
        fi
        if [ "${INPUT_LOAD_CREDENTIAL}" = "true" ] || \
          [ -n "${INPUT_NEXUS_PASSWORD}" ]; then
          modes=$((modes + 1))
        fi
        if [ "${modes}" -gt 1 ]; then
          echo "Error: conflicting authentication modes ❌"
          echo "Choose one of: oidc, auth_token, or Basic auth"
          echo "(nexus_password or load_credential)"
          exit 1
        fi
        # Real publishes need a credential source; failing here gives
        # a clearer error than a mid-publish authentication failure
        if [ "${INPUT_DRY_RUN}" != "true" ] && [ "${modes}" -eq 0 ]; then
          echo "Error: no registry credential configured ❌"
          echo "Provide nexus_password, set load_credential to 'true'"
          echo "(with vault_mapping_json and"
          echo "op_service_account_token), provide auth_token, or set"
          echo "oidc to 'true' for trusted publishing"
          exit 1
        fi
        # npm generates provenance itself under trusted publishing, so
        # --provenance is redundant there and the combination signals a
        # misunderstanding rather than a harmless overlap
        if [ "${INPUT_OIDC}" = "true" ] && \
          [ "${INPUT_PROVENANCE}" = "true" ]; then
          echo "Error: provenance conflicts with oidc ❌"
          echo "Trusted publishing does not take the --provenance"
          echo "flag; npm attaches provenance by itself where it"
          echo "supports it (public package, public repository)."
          echo "Leave provenance at 'false'"
          exit 1
        fi
        # OIDC needs a token endpoint, which only appears when the
        # calling job grants 'id-token: write'. With workflow_call the
        # grant is needed on both the caller and the called workflow.
        #
        # npm requires both variables -- its GitHub path bails unless
        # ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN are present -- so
        # check both. Accepting a lone URL would let validation pass
        # and the run fail after the stamp instead.
        if [ "${INPUT_OIDC}" = "true" ] && \
          [ "${INPUT_DRY_RUN}" != "true" ] && \
          { [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || \
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; }; then
          echo "Error: OIDC requested but no token endpoint ❌"
          echo "Grant 'id-token: write' to the job calling this"
          echo "action. Using a reusable workflow? Grant it on both"
          echo "the caller and the called workflow."
          exit 1
        fi
        # nexus_user is a Basic auth username and carries no secret,
        # so it does not select a mode and does not conflict with one.
        # Callers computing it unconditionally (matrix publishes that
        # mix Nexus and npmjs targets) would break if this rejected,
        # so say it is ignored rather than fail.
        if [ -n "${INPUT_NEXUS_USER}" ] && \
          { [ "${INPUT_OIDC}" = "true" ] || \
            [ -n "${INPUT_AUTH_TOKEN}" ]; }; then
          echo "::notice::Ignoring nexus_user: it applies to Basic" \
            "auth, and this publish uses token or OIDC" \
            "authentication, which carries no username."
        fi
        # load_credential needs both companion inputs; check
        # empty/non-empty alone and never echo the values (secrets)
        if [ "${INPUT_DRY_RUN}" != "true" ] && \
          [ "${INPUT_LOAD_CREDENTIAL}" = "true" ]; then
          if [ -z "${INPUT_VAULT_MAPPING_JSON}" ]; then
            echo "Error: load_credential is 'true' but" \
              "vault_mapping_json is empty ❌"
            echo "Provide vault_mapping_json alongside"
            echo "load_credential"
            exit 1
          fi
          if [ -z "${INPUT_OP_SERVICE_ACCOUNT_TOKEN}" ]; then
            echo "Error: load_credential is 'true' but" \
              "op_service_account_token is empty ❌"
            echo "Provide op_service_account_token alongside"
            echo "load_credential"
            exit 1
          fi
        fi
        # Restrict the Node.js version specifier to a safe character
        # set; the value flows into the setup-node action input
        if [ -n "${INPUT_NODE_VERSION}" ]; then
          case "${INPUT_NODE_VERSION}" in
            *[!A-Za-z0-9./*_-]*)
              echo "Error: invalid node_version ❌"
              echo "Allowed characters: A-Z a-z 0-9 . * / _ -"
              exit 1 ;;
          esac
        fi
        # The version file takes precedence over node_version; check
        # its character set, then confirm it resolves to a file within
        # the workspace
        node_version="${INPUT_NODE_VERSION}"
        node_version_file=""
        if [ -n "${INPUT_NODE_VERSION_FILE}" ]; then
          case "${INPUT_NODE_VERSION_FILE}" in
            *[!A-Za-z0-9./_-]*)
              echo "Error: invalid node_version_file ❌"
              echo "Allowed characters: A-Z a-z 0-9 . / _ -"
              exit 1 ;;
          esac
          case "${INPUT_NODE_VERSION_FILE}" in
            /*) version_file="${INPUT_NODE_VERSION_FILE}" ;;
            *)
              version_file="${GITHUB_WORKSPACE}/"
              version_file="${version_file}${INPUT_NODE_VERSION_FILE}"
              ;;
          esac
          if [ ! -f "${version_file}" ]; then
            echo "Error: node_version_file not found ❌"
            exit 1
          fi
          # Fail closed: an empty result from a failed realpath
          # would degrade the case pattern below to /* and accept
          # any path
          if ! resolved="$(realpath -- "${version_file}")" || \
            [ -z "${resolved}" ]; then
            echo "Error: cannot resolve node_version_file ❌"
            exit 1
          fi
          if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
            [ -z "${workspace}" ]; then
            echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
            exit 1
          fi
          case "${resolved}/" in
            "${workspace}/"*) ;;
            *)
              echo "Error: node_version_file escapes the workspace ❌"
              exit 1 ;;
          esac
          node_version=""
          node_version_file="${INPUT_NODE_VERSION_FILE}"
        fi
        if [ -z "${node_version}" ] && [ -z "${node_version_file}" ]; then
          echo "Error: no Node.js version specified ❌"
          echo "Provide node_version or node_version_file"
          exit 1
        fi
        # Anchor relative paths to GITHUB_WORKSPACE: composite
        # actions can run with a caller-set working directory, so
        # resolving against the current directory would be
        # non-deterministic
        case "${INPUT_PATH_PREFIX}" in
          /*) project_dir="${INPUT_PATH_PREFIX}" ;;
          *) project_dir="${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}" ;;
        esac
        if [ ! -d "${project_dir}" ]; then
          echo "Error: invalid project directory ❌"
          # Strip CR/LF before logging the untrusted path: embedded
          # newlines could otherwise inject workflow commands via the
          # log stream
          printf 'Path not found: %s\n' \
            "$(printf '%s' "${project_dir}" | tr -d '\r\n')"
          exit 1
        fi
        # Restrict publishing to the workspace: an absolute or
        # escaped path could otherwise pack and publish arbitrary
        # runner filesystem content. Fail closed on realpath failure:
        # an empty result would degrade the case pattern below to /*
        # and accept any path
        if ! resolved="$(realpath -- "${project_dir}")" || \
          [ -z "${resolved}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! workspace="$(realpath -- "${GITHUB_WORKSPACE}")" || \
          [ -z "${workspace}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${resolved}/" in
          "${workspace}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        if [ ! -f "${resolved}/package.json" ]; then
          echo "Error: no package.json in project directory ❌"
          exit 1
        fi
        # Both values passed the character allowlists above, so the
        # plain output format is safe here
        echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"
        echo "node_version_file=${node_version_file}" >> "$GITHUB_OUTPUT"

    - name: "Setup Node.js"
      # yamllint disable-line rule:line-length
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.validate.outputs.node_version }}
        node-version-file: ${{ steps.validate.outputs.node_version_file }}

    # Trusted publishing needs npm >= 11.5.2 and Node >= 22.14.0.
    # OIDC publishing landed in 11.5.0, but the floor is 11.5.2:
    # 11.5.1 auto-enables provenance before checking visibility, so
    # it fails a restricted publish outright instead of publishing
    # without an attestation. npm/cli#8467 fixed that in 11.5.2.
    # Meeting the Node floor does not meet the npm one: Node 22 ships
    # npm 10.x, so the check runs after setup-node and reports the
    # remedy rather than upgrading npm behind the caller's back.
    #
    # The remedy has to account for setup-node above having switched
    # PATH to the selected Node and its bundled npm: a global npm
    # upgrade the caller ran against a different Node installation is
    # invisible by this point, so advising it alone would send the
    # caller round a loop that cannot terminate.
    #
    # Runs in dry-run mode too. The check needs no credentials and no
    # network, and a dry run that passed on a toolchain the real
    # publish would reject defeats the point of rehearsing.
    - name: "Verify toolchain supports trusted publishing"
      if: inputs.oidc == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
      run: |
        # Verify toolchain supports trusted publishing
        #
        # validate rejects the provenance *input* alongside oidc, but
        # npm also takes provenance from npm_config_provenance, an
        # .npmrc entry or publishConfig. Trusted publishing attaches
        # provenance by itself, so an ambient setting adds nothing --
        # and for a restricted package npm refuses explicit
        # provenance outright, breaking the documented path where a
        # restricted package publishes without an attestation. Catch
        # it here, before the stamp, rather than letting npm fail
        # after package.json has been rewritten.
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        # Re-enforce the workspace boundary at the point of use, as
        # the stamp, publish and verify steps do: the workspace is
        # mutable between steps, so a validated path could since have
        # become a symlink out of it.
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        cd "${PROJECT_DIR}" || exit 1
        ambient_provenance=''
        if [ "$(jq -r \
          'if (.publishConfig // {}) | has("provenance")
           then "y" else "n" end' \
          package.json 2>/dev/null || echo n)" = "y" ]; then
          if [ "$(jq -r '(.publishConfig // {}).provenance | tostring' \
            package.json 2>/dev/null || echo false)" = "true" ]; then
            ambient_provenance='package.json publishConfig.provenance'
          fi
        elif [ "$(npm config get provenance --no-workspaces \
          2>/dev/null || true)" = "true" ]; then
          ambient_provenance='npm configuration (.npmrc or'
          ambient_provenance="${ambient_provenance} npm_config_provenance)"
        fi
        if [ -n "${ambient_provenance}" ]; then
          echo "::error::provenance is enabled by" \
            "${ambient_provenance}, which conflicts with oidc." \
            "Trusted publishing attaches provenance itself where it" \
            "supports it, and npm refuses explicit provenance for a" \
            "restricted package. Remove that setting."
          exit 1
        fi
        # An explicit false is a legitimate opt-out, not an error --
        # but npm auto-enables provenance under trusted publishing
        # only while the *live config* setting is default
        # (config.isDefault('provenance') in its oidc helper).
        #
        # The two sources differ here, and the difference is not
        # intuitive. An .npmrc entry or npm_config_provenance lands
        # in that config, so it suppresses the auto-enable.
        # publishConfig does not: npm flattens it into the publish
        # options only, leaving isDefault true, and the oidc helper
        # then sets provenance itself and overwrites the option. So
        # publishConfig.provenance=false does *not* prevent an
        # attestation on a public trusted publish.
        #
        # 'npm config list' reports both, but labels the
        # publishConfig block with its own header, so track which
        # section each value came from rather than guessing.
        prov_config=''
        prov_pubcfg=''
        cfg_section='config'
        while IFS= read -r cfg_line; do
          case "${cfg_line}" in
            '; "publishConfig" from '*)
              cfg_section='publishConfig'
              continue ;;
            '; "'*'" config from '*)
              cfg_section='config'
              continue ;;
            ';'*|'') continue ;;
          esac
          case "${cfg_line}" in
            'provenance '*|'provenance='*)
              if [ "${cfg_section}" = 'publishConfig' ]; then
                prov_pubcfg='y'
              else
                prov_config='y'
              fi ;;
          esac
        done <<< "$(npm config list --no-workspaces --no-json \
          --no-long 2>/dev/null || true)"
        if [ -n "${prov_config}" ] && [ -n "${prov_pubcfg}" ]; then
          echo "::notice::provenance is set in both npm" \
            "configuration and publishConfig. The configuration" \
            "entry takes the setting out of its default, so trusted" \
            "publishing does not attach provenance automatically," \
            "and publishConfig then supplies the value npm uses." \
            "This publish carries no attestation."
        elif [ -n "${prov_config}" ]; then
          echo "::notice::provenance is set to false in npm" \
            "configuration (.npmrc or npm_config_provenance). npm" \
            "attaches provenance under trusted publishing only when" \
            "that setting is left at its default, so this publish" \
            "carries no attestation."
        elif [ -n "${prov_pubcfg}" ]; then
          echo "::notice::publishConfig.provenance is false, but npm" \
            "flattens publishConfig into the publish options rather" \
            "than its configuration, so trusted publishing still" \
            "attaches provenance to a public package. Set provenance" \
            "in .npmrc to opt out."
        fi
        #
        # sort -V is not semver aware: it places 11.5.1 before
        # 11.5.1-beta.0, so a prerelease would clear a floor its own
        # release only just meets. Compare the release portion, then
        # treat a prerelease of exactly that release as below it.
        below_floor() {
          have="$1"
          need="$2"
          have_base="${have%%-*}"
          lowest="$(printf '%s\n%s\n' "${need}" "${have_base}" \
            | sort -V | head -n1)"
          if [ "${lowest}" != "${need}" ]; then
            return 0
          fi
          if [ "${have_base}" = "${need}" ] && \
            [ "${have}" != "${have_base}" ]; then
            return 0
          fi
          return 1
        }
        npm_have="$(npm --version)"
        node_have="$(node --version)"
        node_have="${node_have#v}"
        npm_need='11.5.2'
        node_need='22.14.0'
        fail=0
        if below_floor "${npm_have}" "${npm_need}"; then
          echo "::error::npm ${npm_have} is below the ${npm_need}" \
            "required for OIDC trusted publishing. Raise the Node" \
            "version this action selects, through node_version or" \
            "the file named by node_version_file, to a release" \
            "bundling a new enough npm; current Node 24 releases" \
            "clear the floor. To keep the current version, upgrade" \
            "npm after selecting the same version this action uses:" \
            "run actions/setup-node with it, then" \
            "'npm install -g npm@^11', before this action." \
            "Upgrading npm under a different Node installation has" \
            "no effect here, because this action runs setup-node" \
            "first and picks up its bundled npm."
          fail=1
        fi
        if below_floor "${node_have}" "${node_need}"; then
          echo "::error::Node ${node_have} is below the ${node_need}" \
            "required for OIDC trusted publishing. Raise" \
            "node_version, or the version in the file named by" \
            "node_version_file if this action selects Node that way."
          fail=1
        fi
        if [ "${fail}" != "0" ]; then
          exit 1
        fi
        echo "Toolchain supports trusted publishing ✅"
        echo "npm ${npm_have}, Node ${node_have}"

    # Dry-run mode performs no publish and sets up no credential, so
    # it skips the credential machinery entirely. OIDC skips it too:
    # npm exchanges the token at publish time and there is nothing to
    # write. For everything else the npmrc action writes the
    # authenticated file and registers a guaranteed post-job step
    # that scrubs it again
    # npm's OIDC exchange is best-effort: when it fails, npm falls
    # back to whatever credentials it can find rather than stopping.
    # A stale or inherited credential would then publish under a
    # long-lived token while the caller believes they published via
    # trusted publishing -- the opposite of the no-stored-credential
    # guarantee this mode advertises, and silent, because the publish
    # succeeds.
    #
    # Runs before the stamp so a rejected publish leaves package.json
    # untouched, which also makes the guard observable from a test
    # without reaching a registry.
    - name: "Verify no stored credential shadows OIDC"
      if: inputs.oidc == 'true' && inputs.dry_run != 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        REGISTRY_URL: ${{ inputs.registry_url }}
      run: |
        # Verify no stored credential shadows OIDC
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        # Re-enforce the workspace boundary at the point of use, as
        # the stamp, publish and verify steps do: the workspace is
        # mutable between steps, so a validated path could since have
        # become a symlink out of it.
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        cd "${PROJECT_DIR}" || exit 1
        # Ask npm rather than reading .npmrc files. npm publish calls
        # config.getCredentialsByURI(registry), which reads the
        # *merged* configuration -- builtin, global, user, project,
        # env and cli, in precedence order. Reading files separately
        # models none of that, and misses credentials supplied
        # through npm_config_* variables entirely.
        #
        # 'npm config list' prints the merged view, commenting out
        # entries a higher-precedence source overrides, so the
        # uncommented keys are the ones npm will actually read.
        #
        # It masks these values as '(protected)', so this detects a
        # key's presence but not whether its effective value is
        # empty. An entry deliberately blanked in a higher-precedence
        # file is therefore reported, though npm would treat it as
        # absent. That over-reports rather than under-reports, and
        # npm exposes no way to read a protected value -- 'npm config
        # get' refuses them outright.
        # --no-json --no-long because both are caller-controlled npm
        # config. With json=true the output becomes JSON, which omits
        # protected auth keys entirely -- the guard would see no
        # credential and allow the publish, a silent bypass. With
        # long=true the defaults are listed too, so every setting
        # looks explicitly set.
        raw_dump="$(npm config list --no-workspaces --no-json \
          --no-long 2>/dev/null || true)"
        # Drop the publishConfig block. npm reports it here for
        # information, but flattens it into the publish options
        # rather than the live config, and the fallback lookup reads
        # the live config -- so a token there cannot serve as the
        # fallback, and treating it as one would block a valid
        # publish.
        config_dump=''
        in_publishconfig=0
        while IFS= read -r dump_line; do
          case "${dump_line}" in
            '; "publishConfig" from '*)
              in_publishconfig=1
              continue ;;
            '; "'*'" config from '*)
              in_publishconfig=0
              continue ;;
          esac
          if [ "${in_publishconfig}" = "1" ]; then
            continue
          fi
          config_dump="${config_dump}${dump_line}"$'\n'
        done <<< "${raw_dump}"
        if [ -z "${raw_dump}" ]; then
          echo "::error::Cannot read npm configuration, so the" \
            "stored-credential check cannot run. Refusing to publish" \
            "with oidc rather than assume no credential exists."
          exit 1
        fi
        # npm selects the registry with pickRegistry(), which prefers
        # an @scope:registry setting over the --registry this action
        # passes. For a scoped package that can redirect the publish,
        # so resolve it the same way before deriving the key prefix --
        # otherwise the guard inspects one registry while npm
        # authenticates to another.
        effective_registry="${REGISTRY_URL}"
        pkg_scope=''
        pkg_name="$(jq -r '.name // empty' package.json 2>/dev/null \
          || true)"
        case "${pkg_name}" in
          @*/*)
            pkg_scope="${pkg_name%%/*}"
            # The scope reaches a log line below, and package.json is
            # project-controlled input. npm package names allow only
            # this character set, so anything else is malformed and
            # must not be echoed.
            case "${pkg_scope}" in
              @*[!A-Za-z0-9._@-]*|@)
                echo "::error::The package name in package.json has" \
                  "a malformed scope. Expected @scope/name."
                exit 1 ;;
            esac
            # publishConfig cannot supply credentials, but it is
            # flattened into the publish options after the loaded
            # config, and pickRegistry() reads the scoped registry
            # from there. Presence matters, not just truthiness: a
            # key present but empty overlays the config value with a
            # falsey one, and pickRegistry then falls back to
            # opts.registry -- the --registry this action passes --
            # rather than to the .npmrc entry it displaced.
            scope_registry=''
            if [ "$(jq -r --arg k "${pkg_scope}:registry" \
              'if (.publishConfig // {}) | has($k) then "y" else "n" end' \
              package.json 2>/dev/null || echo n)" = "y" ]; then
              scope_registry="$(jq -r --arg k "${pkg_scope}:registry" \
                '(.publishConfig // {})[$k] // "" | tostring' \
                package.json 2>/dev/null || true)"
              case "${scope_registry}" in
                ''|null|false) scope_registry='' ;;
              esac
            else
              scope_registry="$(npm config get --no-workspaces \
                "${pkg_scope}:registry" 2>/dev/null || true)"
              case "${scope_registry}" in
                undefined|null) scope_registry='' ;;
              esac
            fi
            if [ -n "${scope_registry}" ]; then
              effective_registry="${scope_registry}"
            fi ;;
        esac
        # A scoped override arrives from package.json or npm config,
        # neither of which the input validation covers. Apply the
        # same character allowlist registry_url gets, *before* the
        # value reaches a log line: userinfo would put a password in
        # the run log, and a newline would let it forge workflow
        # commands.
        if [ "${effective_registry}" != "${REGISTRY_URL}" ]; then
          case "${effective_registry}" in
            *[!A-Za-z0-9.:/_-]*)
              echo "::error::The @scope:registry override for this" \
                "package contains characters this action refuses." \
                "Allowed: A-Z a-z 0-9 . : / _ -"
              exit 1 ;;
          esac
          case "${effective_registry}" in
            https://?*) ;;
            *)
              echo "::error::The @scope:registry override for this" \
                "package is not an absolute https URL. Trusted" \
                "publishing sends an OIDC token to it, so this" \
                "action refuses a cleartext or malformed registry."
              exit 1 ;;
          esac
          # npm's OIDC helper stores the exchanged token under the
          # registry's raw pathname, while getCredentialsByURI reads
          # it back through nerfDart(), which resolves to the parent
          # directory. Those agree for a root URL -- new URL()
          # normalises a missing path to "/" -- but diverge for a
          # pathful one without a trailing slash, where the exchange
          # succeeds and the publish then finds no credentials.
          # Compare the two derivations rather than test for a slash,
          # which would reject valid root overrides.
          if ! REGISTRY_URL="${effective_registry}" node -e \
            'const p = new URL(process.env.REGISTRY_URL);
             const oidcKey = "//" + p.host + p.pathname;
             const from = p.protocol + "//" + p.host + p.pathname;
             const rel = new URL(".", from);
             const nerf = "//" + rel.host + rel.pathname;
             if (oidcKey !== nerf) { process.exit(1); }' \
            2>/dev/null; then
            echo "::error::The @scope:registry override for this" \
              "package has a path with no trailing slash. npm would" \
              "store the exchanged token under a different key than" \
              "it reads back, so the exchange would succeed and the" \
              "publish would then fail with no credentials. Add a" \
              "trailing slash."
            exit 1
          fi
          # The allowlist already excludes '@', so userinfo cannot
          # survive it; re-check through the parser rather than rely
          # on that, since the two could drift apart.
          if ! REGISTRY_URL="${effective_registry}" node -e \
            'const u = new URL(process.env.REGISTRY_URL);
             if (u.protocol !== "https:" || u.username || u.password) {
               process.exit(1);
             }' 2>/dev/null; then
            echo "::error::The @scope:registry override for this" \
              "package is not a credential-free https URL."
            exit 1
          fi
          echo "::notice::Package scope ${pkg_scope} redirects this" \
            "publish to ${effective_registry}; checking credentials" \
            "for that registry rather than for registry_url."
        fi
        # Replicate npm's nerfDart() exactly rather than
        # approximating it. It resolves the *directory* of the URL --
        # new URL('.', from) -- so a pathful registry without a
        # trailing slash loses its last segment:
        # https://host/repository/npm becomes //host/repository/.
        # registry_url is validated to end in a slash, but a scoped
        # override is not, so appending one here would inspect a key
        # npm never reads.
        nerf="$(REGISTRY_URL="${effective_registry}" node -e \
          'const parsed = new URL(process.env.REGISTRY_URL);
           const from = parsed.protocol + "//" + parsed.host +
             parsed.pathname;
           const rel = new URL(".", from);
           process.stdout.write("//" + rel.host + rel.pathname);' \
          2>/dev/null || true)"
        case "${nerf}" in
          //*/) ;;
          *)
            echo "::error::Cannot derive a registry scope from" \
              "${effective_registry}. Expected an absolute https URL."
            exit 1 ;;
        esac
        # True when the merged configuration carries the key at
        # exactly this prefix. getCredentialsByURI() performs no
        # ancestor-path lookup, so an entry for a parent path or
        # another registry is not a credential for this publish.
        has_key() {
          target="${nerf}:$1"
          while IFS= read -r line; do
            case "${line}" in
              ''|';'*) continue ;;
            esac
            key="${line%%=*}"
            key="${key%"${key##*[![:space:]]}"}"
            if [ "${key}" = "${target}" ]; then
              return 0
            fi
          done <<< "${config_dump}"
          return 1
        }
        # Mirror npm's own test:
        #   noCreds = !(creds.token || creds.username ||
        #               creds.certfile && creds.keyfile)
        # username is populated only when _password accompanies it, or
        # when _auth decodes into a user/password pair, so each of
        # those routes needs its partner too.
        shadow=''
        if has_key '_authToken'; then
          shadow="${shadow} ${nerf}:_authToken"
        fi
        if has_key 'username' && has_key '_password'; then
          shadow="${shadow} ${nerf}:username+_password"
        fi
        if has_key '_auth'; then
          shadow="${shadow} ${nerf}:_auth"
        fi
        if has_key 'certfile' && has_key 'keyfile'; then
          shadow="${shadow} ${nerf}:certfile+keyfile"
        fi
        if [ -n "${shadow}" ]; then
          echo "::error::Stored npm credentials would shadow OIDC:" \
            "${shadow}. npm falls back to them when the trusted" \
            "publisher exchange fails, so the publish could use a" \
            "long-lived credential instead. Remove them, or drop" \
            "oidc and publish with that credential deliberately."
          exit 1
        fi
        echo "No stored credential shadows trusted publishing ✅"

    - name: "Create authenticated .npmrc"
      if: inputs.dry_run != 'true' && inputs.oidc != 'true'
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/node-create-npmrc-action@e0ff8adfc0591c86d8d07828bffab10f43096155 # v0.2.0
      with:
        registry_url: ${{ inputs.registry_url }}
        nexus_user: ${{ inputs.nexus_user }}
        nexus_password: ${{ inputs.nexus_password }}
        auth_token: ${{ inputs.auth_token }}
        load_credential: ${{ inputs.load_credential }}
        vault_mapping_json: ${{ inputs.vault_mapping_json }}
        op_service_account_token: ${{ inputs.op_service_account_token }}
        scope: ${{ inputs.scope }}
        path: ${{ inputs.path_prefix }}

    - name: "Stamp version into package.json"
      id: stamp
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PUBLISH_VERSION: ${{ inputs.publish_version }}
      run: |
        # Stamp version into package.json
        # setup-node provides node/npm; confirm before use in case a
        # caller-side setup problem left the tools unavailable
        for tool in node npm; do
          if ! command -v "${tool}" > /dev/null 2>&1; then
            echo "Error: required tool not found: ${tool} ❌"
            exit 1
          fi
        done
        # Anchor relative paths to GITHUB_WORKSPACE so behaviour stays
        # deterministic when the caller sets a working directory. The
        # :? expansions hard-fail on unset/empty runner variables,
        # which would otherwise weaken the boundary checks below
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        # Re-resolve and enforce the workspace boundary at the point
        # of use: the workspace is mutable between steps, so relying
        # solely on the earlier validate step would leave a TOCTOU
        # gap (a validated directory swapped for an escaping
        # symlink). Fail closed on realpath failure: an empty result
        # would degrade the case pattern below to /* and accept any
        # path
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        cd "${PROJECT_DIR}" || exit 1
        # Surface suppressed lifecycle hooks before stamping. The
        # --ignore-scripts below means anything they would have done
        # (writing the version into a source constant, updating a
        # changelog) does not happen, so the published package keeps
        # its pre-stamp content. That is silent otherwise.
        hooks="$(jq -r '[(.scripts // {}) | keys[]
          | select(. == "preversion" or . == "version"
                   or . == "postversion")] | join(", ")' \
          package.json)"
        if [ -n "${hooks}" ]; then
          echo "::notice::Skipped npm version lifecycle script(s):" \
            "${hooks}. Release lanes stamp without installing" \
            "dependencies, so these do not run; anything they write" \
            "into the package is absent from the published artefact."
        fi
        # Versions get stamped at publish time in the Linux
        # Foundation merge-driven model, so the committed
        # package.json version is not the source of truth;
        # --allow-same-version keeps re-stamping idempotent.
        #
        # --ignore-scripts because no release lane installs
        # dependencies before stamping, so a preversion/version hook
        # invoking the test or build script cannot succeed. Both
        # lanes suppress them, so the two produce the same tree.
        # --no-workspaces because 'npm version' is workspace aware
        # too, and runs before the publish. With workspaces enabled
        # in configuration it stamps every workspace package and
        # leaves this one alone -- rewriting sibling manifests that
        # were never part of this publish.
        #
        # A workspace *selector* in an .npmrc conflicts with the flag
        # rather than being overridden by it, and npm reports that
        # nothing here can detect in advance: the selection appears
        # in neither 'npm config get workspace' nor 'npm config
        # list'. Failing at the stamp is the safe side -- nothing has
        # published yet -- so keep npm's message and add the remedy.
        set +e
        stamp_out="$(npm version "${PUBLISH_VERSION}" \
          --no-git-tag-version --allow-same-version \
          --ignore-scripts --no-workspaces 2>&1)"
        stamp_rc=$?
        set -e
        if [ "${stamp_rc}" != "0" ]; then
          printf '%s\n' "${stamp_out}"
          case "${stamp_out}" in
            *'--no-workspaces and --workspace'*)
              echo "Error: a workspace is selected in npm" \
                "configuration ❌"
              echo "This action publishes one package, so it stamps"
              echo "and publishes with workspaces disabled. Remove"
              echo "the workspace setting and point path_prefix at"
              echo "the package instead." ;;
          esac
          exit 1
        fi
        stamped="$(jq -r '.version // empty' package.json)"
        if [ "${stamped}" != "${PUBLISH_VERSION}" ]; then
          echo "Error: version stamp verification failed ❌"
          printf 'package.json version: %s\n' \
            "$(printf '%s' "${stamped}" | tr -d '\r\n')"
          exit 1
        fi
        echo "Stamped version ${PUBLISH_VERSION} into package.json ✅"

    - name: "Publish package"
      id: publish
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PUBLISH_VERSION: ${{ inputs.publish_version }}
        DRY_RUN: ${{ inputs.dry_run }}
        OIDC: ${{ inputs.oidc }}
        TAG: ${{ inputs.tag }}
        ACCESS: ${{ inputs.access }}
        PROVENANCE: ${{ inputs.provenance }}
        REGISTRY_URL: ${{ inputs.registry_url }}
      run: |
        # Publish package
        # Anchor relative paths to GITHUB_WORKSPACE and re-enforce
        # the workspace boundary at the point of use (TOCTOU). Fail
        # closed on realpath failure: an empty result would degrade
        # the case pattern below to /* and accept any path
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            echo "path_prefix must resolve within GITHUB_WORKSPACE"
            exit 1 ;;
        esac
        # Scratch directory for the publish metadata; removed on step
        # exit because RUNNER_TEMP is not always cleaned between runs
        # on self-hosted runners
        scratch_dir="$(mktemp -d "${RUNNER_TEMP:?}/npmpublish.XXXXXX")"
        trap 'rm -rf -- "${scratch_dir}"' EXIT

        # Change into the project before anything consults npm's
        # configuration. npm resolves the project .npmrc from the
        # working directory, so a lookup made from the workspace root
        # would answer for a different project than the publish below.
        cd "${PROJECT_DIR}" || exit 1

        # Build the publish arguments from validated inputs; every
        # value passed a whole-string allowlist in the validate step
        set -- publish --json --tag "${TAG}"
        # This action publishes the single package at path_prefix.
        # With workspaces enabled through configuration, npm would
        # fan out and emit one metadata entry per package, while the
        # parse below takes a single object -- so several packages
        # would publish and only one would be verified and reported.
        #
        # Unconditional: validate rejects an npm_config_workspace
        # selection, which is the only source npm refuses alongside
        # this flag, so the two cannot conflict.
        set -- "$@" --no-workspaces
        if [ -n "${ACCESS}" ]; then
          set -- "$@" --access "${ACCESS}"
        fi
        # No --provenance under OIDC: npm generates provenance itself
        # for trusted publishes, and validate rejects the combination
        if [ "${PROVENANCE}" = "true" ]; then
          set -- "$@" --provenance
        fi
        if [ "${DRY_RUN}" = "true" ]; then
          set -- "$@" --dry-run
          echo "Publishing in dry-run mode (packs and reports only;" \
            "npm performs no publish)"
        else
          set -- "$@" --registry "${REGISTRY_URL}"
        fi
        # Withhold the OIDC token sources unless npm legitimately
        # needs them. npm attempts a trusted-publish exchange
        # whenever they are present, so a job granting
        # 'id-token: write' for some other step -- attestation or
        # signing, say -- could otherwise have its Basic or token
        # credential quietly replaced by an OIDC one. That would
        # defeat the mutual exclusivity the three modes advertise,
        # and silently, since the publish would succeed.
        #
        # Two cases genuinely need them. --provenance signs with the
        # workflow identity, so a Basic or token publish requesting
        # provenance needs the endpoint even though it is not a
        # trusted publish; clearing it there would break a documented
        # combination. And a real OIDC publish needs it by
        # definition.
        #
        # Provenance is not this action's input alone: npm also takes
        # it from npm_config_provenance, an .npmrc entry, or
        # publishConfig. Deciding from the input would clear the
        # endpoint under a caller whose configuration enabled
        # provenance, breaking a publish that works today -- so
        # consult the effective setting.
        #
        # Follow npm's precedence rather than combining the sources.
        # A CLI flag wins, and #getManifest() drops publishConfig
        # keys that a CLI flag already set; otherwise an explicit
        # publishConfig value overlays the merged config, including
        # an explicit false. So config true plus publishConfig false
        # publishes without provenance, and treating that as true
        # would keep the OIDC endpoint available for nothing.
        provenance_effective="${PROVENANCE}"
        if [ "${provenance_effective}" != "true" ]; then
          if [ "$(jq -r \
            'if (.publishConfig // {}) | has("provenance")
             then "y" else "n" end' \
            package.json 2>/dev/null || echo n)" = "y" ]; then
            if [ "$(jq -r '(.publishConfig // {}).provenance
              | tostring' package.json 2>/dev/null \
              || echo false)" = "true" ]; then
              provenance_effective='true'
            fi
          elif [ "$(npm config get provenance --no-workspaces \
            2>/dev/null || true)" = "true" ]; then
            provenance_effective='true'
          fi
        fi
        # A dry run never needs the endpoint, whatever the mode. npm
        # generates no provenance for a run that publishes nothing,
        # so keeping it would buy nothing and still permit a token
        # exchange during a rehearsal.
        #
        # OIDC and provenance cannot both be set: validate rejects
        # the pair, because npm attaches provenance itself under
        # trusted publishing.
        #
        # NPM_ID_TOKEN is cleared alongside the endpoint variables:
        # npm reads it first, so clearing only those would leave a
        # way in.
        keep_oidc_env=0
        if [ "${DRY_RUN}" != "true" ] && \
          { [ "${provenance_effective}" = "true" ] || \
            [ "${OIDC}" = "true" ]; }; then
          keep_oidc_env=1
        fi
        # NPM_ID_TOKEN goes unconditionally. npm reads it ahead of
        # GitHub's request-based flow and skips the Actions endpoint
        # when it is set, so an ambient or stale value would publish
        # under an identity the endpoint preflight never inspected.
        # The Actions endpoint variables are the only OIDC source
        # this action honours.
        unset NPM_ID_TOKEN
        if [ "${keep_oidc_env}" = "0" ]; then
          unset ACTIONS_ID_TOKEN_REQUEST_URL
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
        fi

        set +e
        npm "$@" > "${scratch_dir}/publish.json"
        publish_exit=$?
        set -e
        if [ "${publish_exit}" != "0" ]; then
          echo "::error::npm publish failed (exit ${publish_exit}) ❌"
          exit 1
        fi

        # The --json output carries the publish metadata; verify it
        # matches the requested version before emitting outputs.
        #
        # Enforce the singular contract on the result rather than
        # trusting the flag alone: an explicit workspace selection
        # skips it, and npm could fan out. Reporting one package
        # while several reached the registry is the failure worth
        # preventing.
        entry_count="$(jq -r 'if (.name | type) == "string"
          then 1 else (to_entries | length) end' \
          "${scratch_dir}/publish.json" 2>/dev/null || echo 1)"
        # Only fan-out is an error here. An empty object falls
        # through to the metadata checks below, which report the
        # missing fields more usefully than a count would.
        case "${entry_count}" in
          ''|0|1) ;;
          *)
            echo "::error::npm published ${entry_count} packages," \
              "but this action verifies and reports one. Publish" \
              "each workspace package with its own path_prefix" \
              "rather than selecting several at once."
            exit 1 ;;
        esac
        # npm 11 keys that object by package name, where npm 10 put
        # the fields at the top level. Normalise to the inner object
        # so both shapes parse, rather than pinning this action to an
        # npm generation: OIDC trusted publishing requires npm 11.5.2
        # or newer, so the newer shape is not optional.
        #
        # Select on the type of .name rather than its presence. A
        # package legitimately named "name" produces {"name": {...}}
        # under npm 11, which a presence test reads as the npm 10
        # flat shape and hands back the metadata object as the
        # package name -- failing the publish after it succeeded.
        # Under npm 10 .name is a string; under npm 11 it is either
        # absent or the nested object.
        meta="$(jq -c 'if (.name | type) == "string" then .
          else (to_entries | .[0].value // {}) end' \
          "${scratch_dir}/publish.json")"
        package_name="$(printf '%s' "${meta}" | jq -r '.name // empty')"
        published_version="$(printf '%s' "${meta}" \
          | jq -r '.version // empty')"
        tarball_name="$(printf '%s' "${meta}" \
          | jq -r '.filename // empty')"
        # Constrain the reported name to the npm package name
        # character set before further use in commands and logs
        case "${package_name}" in
          *[!@A-Za-z0-9._/-]*|'')
            echo "Error: npm reported an unusable package name ❌"
            exit 1 ;;
        esac
        if [ "${published_version}" != "${PUBLISH_VERSION}" ]; then
          echo "Error: published version mismatch ❌"
          printf 'npm reported: %s\n' \
            "$(printf '%s' "${published_version}" | tr -d '\r\n')"
          echo "Expected: ${PUBLISH_VERSION}"
          exit 1
        fi
        if [ -z "${tarball_name}" ]; then
          echo "Error: npm reported no tarball filename ❌"
          exit 1
        fi

        # The metadata values originate from npm's JSON output and
        # could legally contain unusual characters, so they use the
        # multiline heredoc output format with a random delimiter
        # (built from shell-builtin randomness, regenerated until
        # provably absent from the value) to prevent output-file
        # injection
        emit_output() {
          key="$1"
          value="$2"
          delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          while [ "${value#*"${delimiter}"}" != "${value}" ]; do
            delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          done
          {
            printf '%s<<%s\n' "${key}" "${delimiter}"
            printf '%s\n' "${value}"
            printf '%s\n' "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        }
        emit_output "published_version" "${published_version}"
        emit_output "package_name" "${package_name}"
        emit_output "tarball_name" "${tarball_name}"

        echo "Published ${package_name}@${published_version} ✅"
        {
          echo "## 🚀 Node.js Package Publish"
          echo ""
          if [ "${DRY_RUN}" = "true" ]; then
            echo "**Mode:** dry run (packs and reports only)"
          else
            echo "**Mode:** publish"
            echo "**Registry:** ${REGISTRY_URL}"
          fi
          echo "**Package:** ${package_name}"
          echo "**Version:** ${published_version}"
          echo "**Tag:** ${TAG}"
          echo "**Tarball:** ${tarball_name}"
        } >> "$GITHUB_STEP_SUMMARY"

    # Best-effort registry confirmation for real publishes: some
    # registries restrict anonymous reads or index asynchronously, so
    # an unreadable package downgrades to a warning; a readable
    # package with the wrong version fails the action
    - name: "Verify publication on registry"
      if: inputs.dry_run != 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.path_prefix }}
        PACKAGE_NAME: ${{ steps.publish.outputs.package_name }}
        PUBLISHED_VERSION: ${{ steps.publish.outputs.published_version }}
        REGISTRY_URL: ${{ inputs.registry_url }}
      run: |
        # Verify publication on registry
        # Anchor relative paths to GITHUB_WORKSPACE and re-enforce
        # the workspace boundary at the point of use (TOCTOU). Fail
        # closed on realpath failure: an empty result would degrade
        # the case pattern below to /* and accept any path
        case "${PROJECT_DIR}" in
          /*) ;;
          *) PROJECT_DIR="${GITHUB_WORKSPACE:?}/${PROJECT_DIR}" ;;
        esac
        if ! PROJECT_DIR="$(realpath -- "${PROJECT_DIR}")" || \
          [ -z "${PROJECT_DIR}" ]; then
          echo "Error: cannot resolve project directory ❌"
          exit 1
        fi
        if ! boundary="$(realpath -- "${GITHUB_WORKSPACE:?}")" || \
          [ -z "${boundary}" ]; then
          echo "Error: cannot resolve GITHUB_WORKSPACE ❌"
          exit 1
        fi
        case "${PROJECT_DIR}/" in
          "${boundary}/"*) ;;
          *)
            echo "Error: project directory escapes the workspace ❌"
            exit 1 ;;
        esac
        # Re-validate values that crossed a step boundary before use
        case "${PACKAGE_NAME}" in
          *[!@A-Za-z0-9._/-]*|'')
            echo "Error: unusable package name for verification ❌"
            exit 1 ;;
        esac
        case "${PUBLISHED_VERSION}" in
          *[!0-9A-Za-z.-]*|'')
            echo "Error: unusable version for verification ❌"
            exit 1 ;;
        esac
        # Run from the project directory so the authenticated .npmrc
        # written by node-create-npmrc-action applies
        cd "${PROJECT_DIR}" || exit 1
        set +e
        seen="$(npm view "${PACKAGE_NAME}@${PUBLISHED_VERSION}" \
          version --registry "${REGISTRY_URL}" 2>/dev/null)"
        view_exit=$?
        set -e
        if [ "${view_exit}" != "0" ]; then
          echo "::warning::could not confirm" \
            "${PACKAGE_NAME}@${PUBLISHED_VERSION} on the registry" \
            "(anonymous reads may be restricted, or indexing" \
            "may lag)"
          exit 0
        fi
        if [ "${seen}" != "${PUBLISHED_VERSION}" ]; then
          echo "Error: registry reports an unexpected version ❌"
          printf 'Registry reported: %s\n' \
            "$(printf '%s' "${seen}" | tr -d '\r\n')"
          echo "Expected: ${PUBLISHED_VERSION}"
          exit 1
        fi
        echo "Registry confirmed" \
          "${PACKAGE_NAME}@${PUBLISHED_VERSION} ✅"
        echo "Registry confirmed" \
          "${PACKAGE_NAME}@${PUBLISHED_VERSION} ✅" \
          >> "$GITHUB_STEP_SUMMARY"
